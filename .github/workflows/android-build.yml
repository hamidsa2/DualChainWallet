name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.7/bin/gradle --version

      - name: Extract Android project
        run: |
          unzip -q source.zip -d extracted

          if [ -d extracted/DualChainWallet_Project ]; then
            echo "PROJECT_DIR=extracted/DualChainWallet_Project" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          fi

          find extracted -maxdepth 4 -type f | head -100

      - name: Fix duplicate DISCLAIMER resource
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle"

          if not gradle_file.exists():
              gradle_file = project / "app" / "build.gradle.kts"

          if not gradle_file.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle or app/build.gradle.kts not found"
              )

          text = gradle_file.read_text()

          if 'excludes += "META-INF/DISCLAIMER"' not in text:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("ERROR: android block not found")

              insertion = (
                  "\n    packaging {\n"
                  "        resources {\n"
                  '            excludes += "META-INF/DISCLAIMER"\n'
                  "        }\n"
                  "    }\n"
              )
              text = text.replace(marker, marker + insertion, 1)

          gradle_file.write_text(text)
          print("Updated:", gradle_file)
          print(text)
          PY

      - name: Build debug APK
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo ">>> gradle-wrapper.jar missing, regenerating wrapper with Gradle 8.7"
            gradle wrapper --gradle-version 8.7
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace --info assembleDebug 2>&1 | tee /tmp/gradle-build.log
          else
            gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee /tmp/gradle-build.log
          fi
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: DualChainWallet-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload gradle build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build reports and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: DualChainWallet-build-diagnostics
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/**
          if-no-files-found: warn
          retention-days: 7
