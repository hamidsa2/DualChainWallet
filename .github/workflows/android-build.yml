name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.7/bin/gradle --version

      - name: Extract Android project
        run: |
          unzip -q source.zip -d extracted
          if [ -d extracted/DualChainWallet_Project ]; then
            echo "PROJECT_DIR=extracted/DualChainWallet_Project" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          fi
          find extracted -maxdepth 3 -type f | head -80

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DualChainWallet-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DualChainWallet-build-diagnostics
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/**
          if-no-files-found: warn
          retention-days: 7
